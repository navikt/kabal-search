spring:
  application:
    name: kabal-search
  main:
    banner-mode: OFF
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-stacktrace: never
  mvc:
    throw-exception-if-no-handler-found: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 7081
  max-http-request-header-size: 32KB
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  health:
    elasticsearch:
      enabled: false
  endpoint:
    jolokia:
      config:
        - debug: true
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus, jolokia
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    baggage:
      remote-fields:
        - ${navCallIdName}
      correlation:
        fields:
          - ${navCallIdName}

